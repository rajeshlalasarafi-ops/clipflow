.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0;scrollbar-width:thin}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:999px;font:inherit;font-size:13px;cursor:pointer}

.count{color:var(--mute);font-size:13px;margin:4px 0 8px}
ul{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}
li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
li:first-child{border-top:0}
.h{flex:1;min-width:0;overflow-wrap:anywhere;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.h b{font-weight:600}.h span{color:var(--mute)}
.g{font-size:12px;color:var(--mute);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.cp{flex:none;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:4px 10px;font:inherit;font-size:12px;cursor:pointer}
.empty{padding:24px;text-align:center;color:var(--mute)}
.note{color:var(--mute);font-size:12px;margin-top:14px}

const SUF=".tiktok.com";
const R=[
["Junk/typos",/^(u003e|bussines|bussiness|wwww\.)|^cars-https/],

["Web app/regional",/^(www|m\.|m$|o28|lite|webapp|web-|nwww|ww\.|w\.|t\.|us\.|eu\.|in\.|sg\.|usds|now|discover|trending|music|musician|artist|gaming|tv|spotlight|suggestions|media|news|newsroom|notes|activity|account|login|accounts|a9ea0|acdd8|f2f3f|abs-session|wfa|whee|ws-sg|mg\.)|\.us$|\.eu$/],
["Company/support",/careers|carreiras|support|survey|info|safety|getstarted|academy|carrierflow|^e$|^service|pick-pico|partner|experiment|mi-|kr-|apac|sea-/],
["Test/internal",/test|preprod|sandbox|^dev|backend|experiment|live-backstage|\.pvt\./]
];
const names=R.map(r=>r[0]).concat("Other");
const cat=h=>{for(const[n,p]of R)if(p.test(h))return n;return"Other"};
const reg=h=>/\.us$|useast/.test(h)?"US":/(^|-)sg($|\.)|alisg/.test(h)?"Singapore":/-va($|\.)/.test(h)?"Virginia":/\.eu$|^eu/.test(h)?"EU":"";
const rows=RAW.split("\n").map(s=>({s,g:cat(s),r:reg(s)}));
const hue=n=>"hsl("+(names.indexOf(n)*33)+" 55% 48%)";
const cnt={};rows.forEach(x=>cnt[x.g]=(cnt[x.g]||0)+1);
const order=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]);
let sel="All";
const $=id=>document.getElementById(id);
function chips(){
  const all=[["All",rows.length]].concat(order.map(n=>[n,cnt[n]]));
  $("chips").innerHTML="";
  all.forEach(([n,c])=>{const b=document.createElement("button");b.className="chip";b.type="button";
    b.setAttribute("aria-pressed",n===sel);b.innerHTML=n+"<small>"+c+"</small>";
    b.onclick=()=>{sel=n;chips();draw()};$("chips").appendChild(b)});
}
function draw(){
  const q=$("q").value.trim().toLowerCase();
  const f=rows.filter(x=>(sel==="All"||x.g===sel)&&(!q||x.s.toLowerCase().includes(q)));
  $("count").textContent=f.length+" of "+rows.length+" shown";
  const ul=$("list");ul.innerHTML="";
  if(!f.length){ul.innerHTML='<li class="empty">No match. Clear the search or pick another group.</li>';return}
  f.forEach(x=>{
    const li=document.createElement("li");
    const i=x.s.indexOf(".");const first=i<0?x.s:x.s.slice(0,i),rest=i<0?"":x.s.slice(i);
    li.innerHTML='<i class="dot" style="background:'+hue(x.g)+'"></i><div class="h"><b></b><span></span></div><span class="g"></span><button class="cp" type="button">Copy</button>';
    li.querySelector("b").textContent=first;li.querySelector(".h span").textContent=rest+SUF;
    li.querySelector(".g").textContent=x.r?x.g+" · "+x.r:x.g;
    const btn=li.querySelector("button");
    btn.onclick=async()=>{try{await navigator.clipboard.writeText(x.s+SUF);btn.textContent="Copied"}catch(e){btn.textContent="Copy failed"}setTimeout(()=>btn.textContent="Copy",1200)};
    ul.appendChild(li);
  });
}
$("q").addEventListener("input",draw);
chips();draw();
